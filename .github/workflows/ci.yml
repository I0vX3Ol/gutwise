name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly run so a newly disclosed CVE in a dependency surfaces without
  # waiting for the next commit.
  schedule:
    - cron: '0 6 * * 1'

# The default token only ever needs read access here.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs the full history to scan past commits, not just the tip.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Verify colour contrast (WCAG 2.1 AA)
        run: npm run check:contrast

      - name: Build
        run: npm run build

      - name: Verify built site (SEO, a11y, structured data)
        run: npm run check:site

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fails the job on high or critical advisories in runtime dependencies.
      - name: npm audit (production)
        run: npm run audit:deps

      # Informational only — dev-only advisories should not block a content edit.
      - name: npm audit (all, informational)
        run: npm audit || true
